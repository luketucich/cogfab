name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  startup-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes shellcheck

      - name: Check deployment scripts
        run: |
          bash -n deploy/startup.sh
          bash -n deploy/release.sh
          bash -n deploy/monitoring/apply.sh
          shellcheck deploy/startup.sh deploy/release.sh deploy/monitoring/apply.sh

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Build production image
        env:
          IMAGE: cogfab-ci:${{ github.sha }}
        run: docker build --platform linux/amd64 --tag "$IMAGE" .

      - name: Verify production image
        env:
          IMAGE: cogfab-ci:${{ github.sha }}
        run: |
          set -euo pipefail

          readonly container=cogfab-ci
          readonly app_url=http://127.0.0.1:18080
          readonly metrics_url=http://127.0.0.1:19090
          readonly index_file="$RUNNER_TEMP/cogfab-index.html"
          readonly index_headers="$RUNNER_TEMP/cogfab-index-headers.txt"
          readonly asset_file="$RUNNER_TEMP/cogfab-asset.js"
          readonly asset_headers="$RUNNER_TEMP/cogfab-asset-headers.txt"
          readonly compressed_asset="$RUNNER_TEMP/cogfab-asset.js.gz"
          readonly compressed_headers="$RUNNER_TEMP/cogfab-compressed-headers.txt"
          readonly metrics_file="$RUNNER_TEMP/cogfab-metrics.txt"
          readonly collector_file="$RUNNER_TEMP/cogfab-collector.yaml"

          cleanup() {
            exit_code=$?
            trap - EXIT
            if [[ "$exit_code" -ne 0 ]]; then
              docker logs "$container" 2>/dev/null || true
            fi
            docker rm --force "$container" >/dev/null 2>&1 || true
            exit "$exit_code"
          }
          trap cleanup EXIT

          test "$(docker image inspect --format '{{.Architecture}}' "$IMAGE")" = amd64
          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE")" = 65532

          docker run --detach \
            --name "$container" \
            --platform linux/amd64 \
            --publish 127.0.0.1:18080:8080 \
            --publish 127.0.0.1:19090:9090 \
            --env METRICS_ADDR=:9090 \
            "$IMAGE" >/dev/null

          ready=false
          for _ in {1..30}; do
            if curl --fail --silent "$app_url/healthz" >/dev/null &&
              curl --fail --silent "$metrics_url/metrics" --output "$metrics_file"; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true

          test "$(curl --fail --silent "$app_url/healthz")" = ok
          curl --fail --silent --dump-header "$index_headers" \
            "$app_url/" --output "$index_file"
          grep --quiet '<title>Cogfab' "$index_file"
          grep --ignore-case --quiet '^cache-control: no-cache' "$index_headers"

          asset_path=$(sed -n 's/.*src="\([^"]*\.js\)".*/\1/p' "$index_file")
          test -n "$asset_path"
          curl --fail --silent --dump-header "$asset_headers" \
            "$app_url$asset_path" --output "$asset_file"
          curl --fail --silent --header 'Accept-Encoding: gzip' \
            --dump-header "$compressed_headers" \
            "$app_url$asset_path" --output "$compressed_asset"
          grep --ignore-case --quiet \
            '^cache-control: public, max-age=31536000, immutable' "$asset_headers"
          grep --ignore-case --quiet '^vary: Accept-Encoding' "$asset_headers"
          ! grep --ignore-case --quiet '^content-encoding:' "$asset_headers"
          grep --ignore-case --quiet '^content-encoding: gzip' "$compressed_headers"
          grep --ignore-case --quiet '^vary: Accept-Encoding' "$compressed_headers"
          gzip --test "$compressed_asset"
          gzip --decompress --stdout "$compressed_asset" | cmp --silent - "$asset_file"

          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "$app_url/metrics")" = 404
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "$app_url/assets/missing.js")" = 404
          grep --quiet '^cogfab_rooms_active ' "$metrics_file"

          docker cp "${container}:/etc/cogfab/collector.yaml" "$collector_file"
          test -s "$collector_file"

          docker stop --time=20 "$container" >/dev/null
          test "$(docker inspect --format '{{.State.ExitCode}}' "$container")" = 0
