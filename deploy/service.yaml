apiVersion: v1
kind: Service
metadata:
  name: cogfab
  annotations:
    cloud.google.com/backend-config: '{"default": "cogfab-backend"}'
spec:
  type: ClusterIP
  selector:
    app: cogfab
  ports:
    - port: 80
      targetPort: 8080
---
# GKE's default 30-second backend timeout would end WebSocket sessions. An hour
# covers a long session, and the client reconnects if the connection closes.
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: cogfab-backend
spec:
  timeoutSec: 3600
